name: Import audio

# Runs scripts/import-audio.ts: Drive -> ffmpeg -> Supabase Storage "audio" bucket,
# then opens a PR with the regenerated lib/audio-tracks.ts for review.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated slugs to import (blank = all). e.g. japan,resume-design"
        required: false
        default: ""
        type: string
      force:
        description: "Re-encode and re-upload even if already in the bucket"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: import-audio
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -1

      - name: Check secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Add NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # Raw Drive downloads. Keyed on audio-sources.json; the run id suffix lets each run save what it
      # added (cache keys are immutable), and restore-keys fall back to the latest earlier cache, so a
      # changed sources file only downloads the new entries.
      - name: Restore Drive download cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: scripts/.audio-cache
          key: audio-raw-${{ hashFiles('scripts/audio-sources.json') }}-${{ github.run_id }}
          restore-keys: |
            audio-raw-${{ hashFiles('scripts/audio-sources.json') }}-
            audio-raw-

      - name: Fingerprint cache
        id: before
        run: echo "sum=$(ls -l scripts/.audio-cache 2>/dev/null | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Import audio
        id: import
        env:
          ONLY: ${{ inputs.only }}
          FORCE: ${{ inputs.force }}
          # Encoded files go to <runner temp>/wta-audio-import, outside the checkout (the script enforces this).
          # runner.* isn't available in job-level env, only in steps.
          TMPDIR: ${{ runner.temp }}
        run: |
          args=()
          ONLY="${ONLY//[[:space:]]/}"
          if [ -n "$ONLY" ]; then
            if ! [[ "$ONLY" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
              echo "::error::'only' must be comma-separated slugs, e.g. japan,resume-design"
              exit 1
            fi
            args+=("--only=$ONLY")
          fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          npx tsx scripts/import-audio.ts "${args[@]}"

      # Save even when the import failed partway, so partial (.part) downloads resume next run.
      - name: Fingerprint cache after import
        id: after
        if: always()
        run: echo "sum=$(ls -l scripts/.audio-cache 2>/dev/null | md5sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Save Drive download cache
        if: always() && steps.after.outputs.sum != steps.before.outputs.sum
        uses: actions/cache/save@v4
        with:
          path: scripts/.audio-cache
          key: ${{ steps.cache.outputs.cache-primary-key }}

      # The script writes the file even when some entries fail, so upload on failure too (not if it never ran).
      - name: Upload audio-tracks.ts
        if: always() && (steps.import.outcome == 'success' || steps.import.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: audio-tracks
          path: lib/audio-tracks.ts
          if-no-files-found: error

      # Only on a clean run: a failed entry is left out of the generated file, and a PR would read as a removal.
      - name: Open pull request
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/import-audio
          delete-branch: true
          add-paths: lib/audio-tracks.ts
          commit-message: "chore(audio): regenerate lib/audio-tracks.ts"
          title: "Update audio tracks"
          body: |
            Regenerated by the **Import audio** workflow ([run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})).

            - only: `${{ inputs.only || '(all)' }}`
            - force: `${{ inputs.force }}`

            Check the run's summary table before merging. The same file is attached to the run as the `audio-tracks` artifact.

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
